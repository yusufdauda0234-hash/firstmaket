# nginx for FirstMaket on Azure App Service (Linux, PHP 8.x)
#
# App Service's stock config serves /home/site/wwwroot directly. Laravel's
# front controller is one level down in public/, so without replacing this
# the site answers with a directory listing or a 404 and nothing else works.
# Worse, the stock root publishes .env, storage/ and vendor/ to the internet.
#
# Copied into place by deploy/azure/startup.sh, which is set as the App
# Service "Startup Command".

server {
    # 8080 is the port App Service's front end forwards to. Changing it makes
    # the container look unhealthy and the site returns 502.
    listen 8080;
    listen [::]:8080;

    root /home/site/wwwroot/public;
    index index.php index.html;

    # All three portals arrive here. Laravel tells them apart by Host header,
    # so nginx does not need to know about them.
    server_name _;

    port_in_redirect off;
    server_tokens off;

    # Vendor product photos: five at a time, several MB each. The 1MB default
    # rejects them before PHP is reached and the form appears to do nothing.
    client_max_body_size 25M;

    # Compression. App Service's stock nginx leaves gzip_types at the default
    # of text/html alone, so JS, CSS and Inertia's JSON navigation payloads
    # all went out uncompressed — the React vendor chunk alone is 332KB raw
    # against ~112KB gzipped. Already-compressed formats (images, woff2) are
    # deliberately absent from the list.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite content-hashes these, so a new deploy means new filenames — they
    # can be cached indefinitely.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded images, reached through the storage symlink. That symlink
    # points outside wwwroot (LARAVEL_STORAGE_PATH), so nginx has to be
    # willing to follow it.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        disable_symlinks off;
        try_files $uri =404;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        fastcgi_hide_header X-Powered-By;

        # The AI listing review and Paystack calls are the slow paths.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # .env, .git and friends. Nothing dot-prefixed under the web root should
    # ever be readable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
