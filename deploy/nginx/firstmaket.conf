# FirstMaket — nginx site config
#
# One server block serves all three portals. They are the same application:
# Laravel routes on the Host header (bootstrap/app.php registers the admin and
# vendor domains before the unconstrained customer routes), so splitting them
# into separate vhosts would only duplicate the same document root and give
# three places for the PHP settings to drift apart.
#
# Install:
#   sudo cp deploy/nginx/firstmaket.conf /etc/nginx/sites-available/firstmaket
#   sudo ln -s /etc/nginx/sites-available/firstmaket /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is added afterwards by certbot, which rewrites this file in place:
#   sudo certbot --nginx -d firstmaket.com -d www.firstmaket.com \
#                        -d admin.firstmaket.com -d vendors.firstmaket.com

server {
    listen 80;
    listen [::]:80;

    server_name firstmaket.com www.firstmaket.com admin.firstmaket.com vendors.firstmaket.com;

    # Laravel's front controller is the only entry point. Pointing the root at
    # the project directory instead would publish .env, storage/ and the whole
    # vendor tree.
    root /var/www/firstmaket/public;
    index index.php;

    charset utf-8;

    # Product photos can be several MB each and the vendor form takes five at
    # a time; nginx's 1MB default rejects them before PHP is ever reached, and
    # the error looks like the form silently failing.
    client_max_body_size 25M;

    # Do not advertise the exact nginx build to anyone probing for a version
    # with a known CVE.
    server_tokens off;

    # Compression.
    #
    # The stock nginx.conf ships `gzip on` but leaves gzip_types at its default
    # of text/html alone, so every .js, .css and Inertia JSON response was
    # going out uncompressed. The React vendor chunk is 332KB raw against
    # ~112KB gzipped — the largest single saving available on a cold visit,
    # and it applies to every navigation response too, since an Inertia visit
    # is an application/json payload.
    #
    # Images, fonts in woff2 and anything already compressed are left out on
    # purpose: re-compressing them costs CPU and gains nothing.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    # 5 is the knee of the curve — most of the saving, little of the CPU.
    gzip_comp_level 5;
    # Below ~1KB the gzip header and the extra round of work outweigh it.
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Brotli beats gzip by a further ~15% on text, but needs
    # libnginx-mod-brotli installed. Once it is, add:
    #   brotli on; brotli_comp_level 5; brotli_types <same list as above>;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets are content-hashed by Vite, so they can be cached hard and
    # forever — a new deploy produces new filenames.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded product images, served from the storage symlink.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;

        # The AI listing review and Paystack calls are the slow paths; 60s is
        # generous without letting a hung upstream hold a worker forever.
        fastcgi_read_timeout 60s;
    }

    # Anything dot-prefixed: .env, .git, .htaccess. Nothing under the web root
    # should be readable that starts with a dot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/firstmaket.error.log;
    access_log /var/log/nginx/firstmaket.access.log;
}
